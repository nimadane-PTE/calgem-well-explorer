<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Well Explorer AI · Usage Log</title>
  <style>
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f3f6f8;color:#1d2a36}
    main{max-width:1100px;margin:40px auto;padding:0 20px}
    .card{background:white;border:1px solid #dce3e8;border-radius:16px;padding:20px;box-shadow:0 8px 28px rgba(25,40,55,.08)}
    h1{margin:0 0 8px;font-size:24px}.muted{color:#687583;font-size:13px;line-height:1.5}
    form{display:grid;grid-template-columns:1fr 180px auto auto;gap:10px;margin:18px 0}
    input,button{height:42px;border-radius:10px;font:inherit}input{border:1px solid #bdc8d1;padding:0 11px}button{border:0;background:#1f5f9f;color:white;padding:0 15px;cursor:pointer}
    button.secondary{background:#eef3f7;color:#304252;border:1px solid #ced8df}
    #status{min-height:22px;margin:8px 0;color:#5e6c79;font-size:12px}
    .table-wrap{overflow:auto;max-height:65vh;border:1px solid #dce3e8;border-radius:10px}
    table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:8px 9px;border-bottom:1px solid #edf1f4;text-align:left;white-space:nowrap;vertical-align:top}th{position:sticky;top:0;background:#f7f9fb}td.message{white-space:normal;min-width:300px;max-width:520px}
    @media(max-width:800px){form{grid-template-columns:1fr}.table-wrap{max-height:60vh}}
  </style>
</head>
<body>
  <main>
    <div class="card">
      <h1>Well Explorer AI usage log</h1>
      <p class="muted">Private owner view. The admin key is sent only to the protected server endpoint and is kept in this browser session, not in the public source code.</p>
      <form id="admin-form">
        <input id="admin-key" type="password" autocomplete="off" placeholder="Admin key" required />
        <input id="admin-date" type="date" required />
        <button type="submit">Load log</button>
        <button id="download-csv" class="secondary" type="button">Download CSV</button>
      </form>
      <div id="status"></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Time</th><th>Name</th><th>Email</th><th>Type</th><th>Status</th><th>Query</th></tr></thead>
          <tbody id="log-body"></tbody>
        </table>
      </div>
    </div>
  </main>
  <script type="module" src="./admin.js"></script>
</body>
</html>
